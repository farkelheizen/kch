name: macOS checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zsh syntax, whitespace lint and CLI checks
        run: zsh tests/test-cli.zsh
      - name: Temporary-keychain integration
        run: zsh tests/test-integration.zsh
